# Modus Operandi (tinted) theme
set -g status-style fg=#000000,bg=#fbf7f0
set -g window-status-current-style fg=#fbf7f0,bold,bg=#3548cf
set -g window-status-last-style fg=#000000,bold,bg=#efe9dd
set -g pane-active-border-style bg=default,fg=#3548cf
set -g pane-border-style bg=default,fg=#9f9690

# #h hostshort , #S session , #W window , #T pane name
wg_prfx=" #[fg=default,bg=#efe9dd]#{?client_prefix,<Prefix>,}"  # prefix indicator widget
wg_pane=" #[fg=default,bg=#efe9dd]#{=26:pane_title}"
wg_date=" #[fg=default,bg=#efe9dd]%d-%b-%Y#[none]"
wg_time=" #[fg=default,bg=#efe9dd]%H:%M#[none]  "
set -g status-right "${wg_prfx}${wg_pane}${wg_date}${wg_time}"
