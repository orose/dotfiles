# --> Gruvbox Material Light (medium, material foreground)
set -gq @thm_bg "#fbf1c7"    # bg0
set -gq @thm_fg "#654735"    # fg0
# Monotones
set -gq @thm_bg_dim "#f2e5bc"
set -gq @thm_bg1    "#f4e8be"
set -gq @thm_bg3    "#eee0b7"
set -gq @thm_bg5    "#ddccab"
set -gq @thm_grey0  "#a89984"
set -gq @thm_grey1  "#928374"
set -gq @thm_grey2  "#7c6f64"
# Accents
set -gq @thm_red    "#c14a4a"
set -gq @thm_orange "#c35e0a"
set -gq @thm_yellow "#b47109"
set -gq @thm_green  "#6c782e"
set -gq @thm_aqua   "#4c7a5d"
set -gq @thm_blue   "#45707a"
set -gq @thm_purple "#945e80"

# --> Semantic
set -gqF @cfg_bg "#{@thm_bg}"
set -gqF @cfg_fg "#{@thm_fg}"
set -gqF @cfg_accent "#{@thm_blue}"
set -gqF @cfg_pane_title "#{@thm_green}"
set -gqF @cfg_date "#{@thm_orange}"
set -gqF @cfg_window_last "#{@thm_bg5}"
