# --> Gruvbox Material Dark (medium, material foreground)
set -gq @thm_bg "#282828"    # bg0
set -gq @thm_fg "#d4be98"    # fg0
# Monotones
set -gq @thm_bg_dim "#1b1b1b"
set -gq @thm_bg1    "#32302f"
set -gq @thm_bg3    "#45403d"
set -gq @thm_bg5    "#5a524c"
set -gq @thm_grey0  "#7c6f64"
set -gq @thm_grey1  "#928374"
set -gq @thm_grey2  "#a89984"
# Accents
set -gq @thm_red    "#ea6962"
set -gq @thm_orange "#e78a4e"
set -gq @thm_yellow "#d8a657"
set -gq @thm_green  "#a9b665"
set -gq @thm_aqua   "#89b482"
set -gq @thm_blue   "#7daea3"
set -gq @thm_purple "#d3869b"

# --> Semantic
set -gqF @cfg_bg "#{@thm_bg}"
set -gqF @cfg_fg "#{@thm_fg}"
set -gqF @cfg_accent "#{@thm_blue}"
set -gqF @cfg_pane_title "#{@thm_green}"
set -gqF @cfg_date "#{@thm_orange}"
set -gqF @cfg_window_last "#{@thm_bg3}"
