"$schema" = 'https://starship.rs/config-schema.json'

# Pill-stil: hvert segment er en egen avrundet boble med mellomrom mellom.
# OS/bruker, katalog og tid vises alltid (kanter i outer format).
# Git, språk og docker har kanter i egne format-strenger –
# vises kun når aktive, slik at ingen tomme bobler dukker opp.

format = """
\ue0b6$os$username\ue0b4 \
\ue0b6$directory\ue0b4 \
$git_branch\
$git_status\
$java\
$kotlin\
$nodejs\
$docker_context\
\ue0b6$time\ue0b4\
$cmd_duration\
$line_break\
$character"""

palette = 'modus_operandi'

# ── Alltid synlige segmenter ────────────────────────────────────────────────

[os]
disabled = false
style = "bg:red fg:white"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:red fg:white"
style_root = "bg:red fg:white"
format = '[ $user ]($style)'

[directory]
style = "bg:orange fg:white"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[time]
disabled = false
time_format = "%R"
style = "bg:magenta"
format = '[  $time ](fg:white bg:magenta)'

# ── Git: branch åpner boblen, status lukker den + legger til mellomrom ──────
# Når ikke i git-repo: begge produserer ingenting → ingen boble.
# I rent repo: branch åpner, status leverer kun lukke-cap.

[git_branch]
symbol = ""
style = "bg:yellow"
format = '\ue0b6[  $branch ](fg:white bg:yellow)'

[git_status]
style = "bg:yellow"
format = '[($all_status$ahead_behind )](fg:white bg:yellow)\ue0b4 '

# ── Språk/runtime: hver modul er sin egen komplette boble ───────────────────
# Format: åpne-cap + innhold + lukke-cap + mellomrom
# Vises kun i relevante prosjektkatalogер.

[java]
symbol = " "
style = "bg:green"
format = '\ue0b6[  $version ](fg:white bg:green)\ue0b4 '

[kotlin]
symbol = ""
style = "bg:green"
format = '\ue0b6[  $version ](fg:white bg:green)\ue0b4 '

[nodejs]
symbol = ""
style = "bg:green"
format = '\ue0b6[  $version ](fg:white bg:green)\ue0b4 '

[docker_context]
symbol = ""
style = "bg:cyan"
format = '\ue0b6[  $context ](fg:white bg:cyan)\ue0b4 '

# ── Tegn og varighet ─────────────────────────────────────────────────────────

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:magenta)'
vimcmd_replace_symbol = '[❮](bold fg:magenta)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = '  $duration '
disabled = false
show_notifications = true
min_time_to_notify = 45000

# ── Modus Operandi-palett ────────────────────────────────────────────────────

[palettes.modus_operandi]
red     = "#a60000"   # modus-red        → OS/bruker
orange  = "#972500"   # modus-red-warmer → katalog
yellow  = "#6f5500"   # modus-yellow     → git
green   = "#006800"   # modus-green      → språk/runtime
blue    = "#0031a9"   # modus-blue       → conda
cyan    = "#005e8b"   # modus-cyan       → docker
magenta = "#721045"   # modus-magenta    → tid
white   = "#ffffff"
black   = "#000000"
